spring:
    application:
        name: jpa-relations-revision
    config:
        import:
            - optional:file:.env[.properties]
    datasource:
        url: jdbc:mysql://localhost:3306/jpa_relations
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update

server:
    port: ${SERVER_PORT}